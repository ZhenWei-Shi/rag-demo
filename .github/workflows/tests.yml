name: RAG regression
on:
  push:
    branches: ['codex/**', master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rag-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      ANONYMIZED_TELEMETRY: 'False'
      RAG_EVAL_PYTHON: python
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install CPU-only Python dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Cache public embedding model before offline tests
        run: python -c "from rag.embedder import warmup; warmup()"
      - name: Python regression and frozen artifact integrity
        run: python -m pytest -q --tb=short tests
      - name: Install development report tooling without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Node replay and framework contracts
        run: npm run test:eval-adapter
      - name: Compile and syntax checks
        run: |
          python -m compileall -q api rag evaluation tools tests app.py
          node --check evaluation/render.cjs
          node --check evaluation/framework-check.cjs
          for file in static/js/*.js; do node --check "$file"; done
